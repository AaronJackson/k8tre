apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - mssql-service.yaml


configMapGenerator:
  - name: mssql-init-scripts
    namespace: ad
    files:
      - mssql-init.sh

  # This will be globbed by the ad service and executed there
  - name: custom-samba-start-mssql
    namespace: ad
    files:
      - mssql-spn.sh
